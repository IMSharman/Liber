name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Persistent Release Keystore
        if: ${{ secrets.LIBER_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.LIBER_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/liber-release.jks"
          echo "LIBER_KEYSTORE_PATH=$RUNNER_TEMP/liber-release.jks" >> "$GITHUB_ENV"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble Signed Release APK
        env:
          LIBER_KEYSTORE_PASSWORD: ${{ secrets.LIBER_KEYSTORE_PASSWORD }}
          LIBER_KEY_ALIAS: ${{ secrets.LIBER_KEY_ALIAS }}
          LIBER_KEY_PASSWORD: ${{ secrets.LIBER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK Signing Certificate
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Clean Up Temporary Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/liber-release.jks"

      - name: Rename Release APK
        run: cp app/build/outputs/apk/release/app-release.apk "Liber-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Liber-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
